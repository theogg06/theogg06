<style>
/* Layout: glass top bar with a sliding pill nav, four summary tiles, filter bar, then a wrapping grid of ticker cards.
   Deliberately single dark look, after the reference reel: warm smoked glass over a blurred amber room. */
:root {
  color-scheme: dark;
  --bg: #120d0a;
  --glass: rgba(44, 33, 26, 0.62);
  --glass-hi: rgba(66, 50, 40, 0.7);
  --line: rgba(255, 222, 196, 0.09);
  --fg: #f4ebe3;
  --muted: #a9968a;
  --faint: #6f6058;
  --accent: #ff8b4d;
  --accent-ink: #2a1206;
  --pill: #f4ebe3;
  --pill-ink: #1b130e;
  --up: #63d6a0;
  --down: #ff6f6a;
  --flat: #58b6ff;
  --font-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}
/* blurred "room" behind the glass */
.room {
  position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 50% at 18% 20%, rgba(255, 170, 90, 0.28), transparent 70%),
    radial-gradient(35% 45% at 82% 15%, rgba(255, 210, 150, 0.18), transparent 70%),
    radial-gradient(50% 40% at 60% 85%, rgba(150, 70, 30, 0.35), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255, 220, 180, 0.05) 0 2px, transparent 2px 180px),
    linear-gradient(180deg, #2a1b12, #120d0a 70%);
  filter: blur(28px) saturate(1.1);
}
.shell {
  position: relative; z-index: 1;
  max-width: 1320px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px;
}
.shell > * { min-width: 0; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 12px 10px 16px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.brand { display: grid; line-height: 1.1; }
.brand b { font-size: 17px; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-size: 11px; }
.nav-scroll { flex: 1 1 420px; min-width: 0; overflow-x: auto; scrollbar-width: none; display: flex; justify-content: center; }
.nav-scroll::-webkit-scrollbar { display: none; }
.track {
  position: relative; display: inline-flex; gap: 2px; padding: 4px;
  background: rgba(0, 0, 0, 0.22); border: 1px solid var(--line); border-radius: 999px;
}
.pill {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--glass-hi);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  clip-path: inset(0 100% 0 0 round 999px);
  pointer-events: none;
}
.track.light .pill { background: var(--pill); }
.track button {
  position: relative; z-index: 1;
  font: 500 12.5px/1 var(--font-body); color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  transition: color .3s;
}
.track button:hover { color: var(--fg); }
.track button[aria-pressed="true"] { color: var(--fg); }
.track.light button[aria-pressed="true"] { color: var(--pill-ink); }
.track button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.kbd {
  display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px;
  padding: 8px 10px 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,.2);
}
.kbd span { font-family: var(--font-data); font-size: 10px; padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,.07); }
.btn {
  font: 600 12.5px/1 var(--font-body); border: 0; cursor: pointer;
  padding: 10px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 6px 20px -6px rgba(255, 139, 77, 0.7);
}
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--muted); position: relative;
}
.icon-btn i { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ---------- heading ---------- */
.head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.head p b { color: var(--fg); font-weight: 500; font-family: var(--font-data); font-size: 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 4px rgba(99,214,160,.15); }

/* ---------- summary tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.tile {
  display: flex; gap: 12px; align-items: center; padding: 14px 16px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.tile .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.tile .ic svg { width: 20px; height: 20px; }
.tile small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .02em; }
.tile strong { display: block; font: 500 20px/1.25 var(--font-data); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile em { font-style: normal; color: var(--faint); font-size: 11px; }
.tile strong.txt { font-size: 15px; }
.breadth { display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 6px; width: 150px; }
.breadth span { display: block; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px; min-width: 0; flex: 0 1 260px;
  border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,.22); color: var(--muted);
}
.search input { all: unset; flex: 1; min-width: 0; color: var(--fg); font-size: 12.5px; }
.search input::placeholder { color: var(--faint); }
.search:focus-within { border-color: var(--accent); }

/* ---------- ticker cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 12px; padding: 14px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: border-color .25s, background .25s;
}
.card:hover { border-color: rgba(255, 180, 130, .25); background: rgba(56, 42, 33, .7); }
.card.is-hidden { display: none; }
.c-head { display: flex; align-items: center; gap: 10px; }
.av {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font: 600 11px/1 var(--font-body); color: var(--pill-ink); background: var(--pill);
}
.c-head b { display: block; font-size: 14px; font-weight: 600; }
.c-head small { color: var(--muted); font-size: 11px; font-family: var(--font-data); }
.c-body { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
.c-body small { display: block; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.price { font: 500 22px/1.15 var(--font-data); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.price sup { font-size: 10px; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.spark { width: 116px; height: 44px; flex: none; overflow: visible; }
.ohlc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 0 0; border-top: 1px solid var(--line); }
.ohlc div { display: grid; gap: 2px; min-width: 0; }
.ohlc small { color: var(--faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; }
.ohlc span { font: 400 11px/1.2 var(--font-data); font-variant-numeric: tabular-nums; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px;
  font: 500 10.5px/1 var(--font-data); background: rgba(255,255,255,.06); color: var(--muted); white-space: nowrap;
}
.chip.up { color: var(--up); background: rgba(99,214,160,.12); }
.chip.down { color: var(--down); background: rgba(255,111,106,.12); }
.chip.flat { color: var(--flat); background: rgba(88,182,255,.12); }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.val { margin-left: auto; text-align: right; }
.val small { display: block; color: var(--faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; }
.val span { font: 500 11.5px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }

.footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; padding-top: 6px; border-top: 1px solid var(--line); }
.footer b { color: var(--muted); font-family: var(--font-data); font-weight: 400; }

@media (max-width: 720px) {
  .kbd { display: none; }
  .nav-scroll { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .toolbar .spacer { display: none; }
  .search { flex: 1 1 100%; }
}

<script>
gsap.registerPlugin(Flip);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) gsap.globalTimeline.timeScale(50);

/* ================= src/motion.ts (from the reel, as JS) ================= */
// its l / r / t / b inset of the target inside the bar
function edges(target) {
  const bar = target.parentElement;
  const l = target.offsetLeft, t = target.offsetTop;
  return {
    l, t,
    r: bar.offsetWidth - (l + target.offsetWidth),
    b: bar.offsetHeight - (t + target.offsetHeight),
  };
}
const clip = (s) => `inset(${s.t}px ${s.r}px ${s.b}px ${s.l}px round 999px)`;

function slidePill(pill, target) {
  const to = edges(target);
  const st = pill.__st ?? { ...to };
  pill.__st = st;
  gsap.killTweensOf(st);
  const vertical = Math.abs(to.t - st.t) > Math.abs(to.l - st.l);
  const fwd = vertical ? to.t > st.t : to.l > st.l;
  // the leading edge goes first and faster; the trailing edge catches
  // up, so the pill stretches like a drop instead of sliding stiffly
  const [lead, trail] = vertical
    ? (fwd ? ['b', 't'] : ['t', 'b'])
    : (fwd ? ['r', 'l'] : ['l', 'r']);
  const paint = () => gsap.set(pill, { clipPath: clip(st) });
  // keep the cross axis locked to the target
  for (const k of vertical ? ['l', 'r'] : ['t', 'b']) st[k] = to[k];
  gsap.to(st, { [lead]: to[lead], duration: 0.36,
    ease: 'power3.out', onUpdate: paint });
  gsap.to(st, { [trail]: to[trail], duration: 0.55,
    ease: 'power3.inOut', onUpdate: paint });
}
/* ======================================================================= */

function pillGroup(track, onPick) {
  const pill = track.querySelector('.pill');
  const btns = [...track.querySelectorAll('button')];
  const pick = (b, silent) => {
    btns.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    slidePill(pill, b);
    if (!silent && onPick) onPick(b);
  };
  btns.forEach(b => b.addEventListener('click', () => pick(b)));
  const current = () => btns.find(b => b.getAttribute('aria-pressed') === 'true');
  // first paint: snap to the active button
  const e = edges(current());
  pill.__st = { ...e };
  gsap.set(pill, { clipPath: clip(e) });
  const snap = () => {
    const c = edges(current());
    gsap.killTweensOf(pill.__st);
    Object.assign(pill.__st, c);
    gsap.set(pill, { clipPath: clip(c) });
  };
  addEventListener('resize', snap);
  document.fonts?.ready.then(snap);
  return { pick, btns };
}

/* ================= data: BVB-style table, 30.10.2026 18:00 ================= */
const ROWS = [
  // sym, price, chg%, open, max, min, avg, value, volume, trades
  ['HAI', 0.2220, -1.77, 0.2200, 0.2550, 0.2100, 0.2250, 182276.46, 808986, 89],
  ['JTG', 4.8800, -1.81, 4.8600, 5.0000, 4.8500, 4.9600, 62191.78, 12539, 30],
  ['DN', 3.4700, -0.57, 3.4900, 3.5300, 3.4600, 3.4800, 46123.56, 13257, 44],
  ['PELA', 0.0880, -23.48, 0.1150, 0.1460, 0.0850, 0.0980, 44639.18, 455151, 64],
  ['CC', 12.9500, -1.15, 12.8000, 12.9500, 12.7500, 12.8500, 11023.05, 858, 10],
  ['MAMA', 0.2200, 6.80, 0.2200, 0.2200, 0.2000, 0.2100, 4466.17, 21312, 11],
  ['BUCU', 1.7100, -2.29, 1.7800, 1.7800, 1.7100, 1.7400, 3976.96, 2282, 4],
  ['ARJI', 17.0000, 25.93, 17.0000, 17.0000, 17.0000, 17.0000, 136.00, 8, 1],
  ['SIDG', 0.2320, 0.00, 0.2100, 0.2320, 0.2100, 0.2100, 114.68, 546, 2],
  ['CEPO', 5.7500, -22.82, 5.7500, 5.7500, 5.7500, 5.7500, 5.75, 1, 1],
].map(([sym, price, chg, open, max, min, avg, value, vol, trades], i) =>
  ({ sym, price, chg, open, max, min, avg, value, vol, trades, rank: i,
     dir: chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat' }));
const TOTAL = { symbols: 144, value: 81282429.10, vol: 26745362, trades: 8344 };

// Romanian number format: 81.282.429,10
function ro(n, d = 0) {
  const [i, f] = Math.abs(n).toFixed(d).split('.');
  const s = (n < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return f ? s + ',' + f : s;
}
const DIR = { up: { c: 'var(--up)', a: '▲' }, down: { c: 'var(--down)', a: '▼' }, flat: { c: 'var(--flat)', a: '■' } };

// deterministic intraday path: open → touches high & low → close
function path(r) {
  let seed = [...r.sym].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let k = 0; k < 6; k++) rnd(); // decorrelate similar seeds
  const N = 26, span = r.max - r.min;
  if (span === 0) return Array.from({ length: N }, () => r.price);
  // anchors: open at 0, the day's high and low somewhere inside, close at the end
  let hiAt = 4 + Math.floor(rnd() * (N - 8)), loAt = 4 + Math.floor(rnd() * (N - 8));
  if (Math.abs(hiAt - loAt) < 4) loAt = hiAt < N / 2 ? hiAt + 6 : hiAt - 6;
  const anchors = [[0, r.open], [hiAt, r.max], [loAt, r.min], [N - 1, r.price]].sort((a, b) => a[0] - b[0]);
  const pts = [];
  for (let k = 0; k < anchors.length - 1; k++) {
    const [i0, v0] = anchors[k], [i1, v1] = anchors[k + 1];
    for (let i = i0; i < i1; i++) {
      const t = (i - i0) / (i1 - i0);
      const e = t * t * (3 - 2 * t); // smoothstep between anchors
      const wob = (rnd() - 0.5) * span * 0.22 * Math.sin(Math.PI * t);
      pts.push(Math.min(r.max, Math.max(r.min, v0 + (v1 - v0) * e + wob)));
    }
  }
  pts.push(r.price);
  return pts;
}
function sparkSVG(r, id) {
  const W = 116, H = 44, p = path(r), lo = r.min, hi = r.max, span = hi - lo || 1;
  const xy = p.map((v, i) => [ (i / (p.length - 1)) * W, hi === lo ? H / 2 : 3 + (1 - (v - lo) / span) * (H - 6) ]);
  const d = xy.map(([x, y], i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1)).join(' ');
  const [ex, ey] = xy[xy.length - 1];
  const col = DIR[r.dir].c;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="rgba(255,222,196,.08)" stroke-dasharray="2 3"/>
    <path class="area" d="${d} L${W} ${H} L0 ${H} Z" fill="url(#g${id})"/>
    <path class="line" d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="end" cx="${ex}" cy="${ey}" r="2.8" fill="${col}" stroke="var(--bg)" stroke-width="1.5"/>
  </svg>`;
}

/* ---------- tiles ---------- */
const ups = ROWS.filter(r => r.dir === 'up').length, downs = ROWS.filter(r => r.dir === 'down').length, flats = ROWS.length - ups - downs;
const icon = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const TILES = [
  { label: 'Traded value · RON', n: TOTAL.value, d: 2, sub: `${TOTAL.symbols} symbols · today`, bg: 'rgba(255,139,77,.18)', fg: 'var(--accent)', ic: icon('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>') },
  { label: 'Volume · shares', n: TOTAL.vol, d: 0, sub: 'all boards', bg: 'rgba(88,182,255,.16)', fg: 'var(--flat)', ic: icon('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>') },
  { label: 'Trades', n: TOTAL.trades, d: 0, sub: `${ROWS.reduce((a, r) => a + r.trades, 0)} in the top 10`, bg: 'rgba(99,214,160,.15)', fg: 'var(--up)', ic: icon('<path d="M7 7h11l-3-3M17 17H6l3 3"/>') },
  { label: 'Breadth · top 10', text: `${ups} up · ${downs} down · ${flats} flat`, bar: true, bg: 'rgba(255,111,106,.15)', fg: 'var(--down)', ic: icon('<circle cx="12" cy="12" r="9"/><path d="M12 3v18"/>') },
];
document.getElementById('tiles').innerHTML = TILES.map((t, i) => `
  <div class="tile">
    <div class="ic" style="background:${t.bg};color:${t.fg}">${t.ic}</div>
    <div style="min-width:0">
      <small>${t.label}</small>
      <strong class="${t.text ? 'txt' : ''}" data-n="${t.n ?? ''}" data-d="${t.d ?? 0}">${t.text ?? ro(t.n, t.d)}</strong>
      ${t.bar ? `<div class="breadth"><span style="flex:${ups};background:var(--up)"></span><span style="flex:${downs};background:var(--down)"></span><span style="flex:${flats};background:var(--flat)"></span></div>`
               : `<em>${t.sub}</em>`}
    </div>
  </div>`).join('');

/* ---------- cards ---------- */
const grid = document.getElementById('grid');
grid.innerHTML = ROWS.map((r, i) => {
  const dec = r.price < 1 ? 4 : 2;
  return `
  <article class="card" data-sym="${r.sym}" data-dir="${r.dir}">
    <div class="c-head">
      <div class="av">${r.sym.slice(0, 2)}</div>
      <div><b>${r.sym}</b><small>XRS1 · 18:00:00</small></div>
    </div>
    <div class="c-body">
      <div><small>Price</small><div class="price"><span data-n="${r.price}" data-d="4">${ro(r.price, 4)}</span><sup>RON</sup></div></div>
      ${sparkSVG(r, i)}
    </div>
    <div class="ohlc">
      <div><small>Open</small><span>${ro(r.open, 4)}</span></div>
      <div><small>High</small><span>${ro(r.max, 4)}</span></div>
      <div><small>Low</small><span>${ro(r.min, 4)}</span></div>
      <div><small>Avg</small><span>${ro(r.avg, 4)}</span></div>
    </div>
    <div class="c-foot">
      <span class="chip ${r.dir}">${DIR[r.dir].a} ${ro(r.chg, 2)}%</span>
      <span class="chip"><span class="dot"></span>${ro(r.trades)} ${r.trades === 1 ? 'trade' : 'trades'}</span>
      <div class="val"><small>Value · Vol</small><span>${ro(r.value, 2)}</span> <span style="color:var(--muted)">· ${ro(r.vol)}</span></div>
    </div>
  </article>`;
}).join('');
const cards = [...grid.children];

/* ---------- intro choreography ---------- */
function countUp(el, delay) {
  const n = parseFloat(el.dataset.n); if (isNaN(n)) return;
  const d = +el.dataset.d, o = { v: 0 };
  gsap.to(o, { v: n, duration: 1.3, delay, ease: 'power3.out', onUpdate: () => el.textContent = ro(o.v, d) });
}
const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
tl.from('.topbar', { y: -16, opacity: 0, duration: .6 })
  .from('.head > *', { y: 14, opacity: 0, duration: .6, stagger: .08 }, '-=.3')
  .from('.tile', { y: 18, opacity: 0, duration: .6, stagger: .07 }, '-=.35')
  .from('.toolbar > *', { y: 10, opacity: 0, duration: .5, stagger: .05 }, '-=.4')
  .from(cards, { y: 26, opacity: 0, scale: .97, duration: .7, stagger: { each: .05, grid: 'auto', from: 'start' } }, '-=.35');
document.querySelectorAll('.tile strong[data-n]').forEach((el, i) => el.dataset.n && countUp(el, .5 + i * .07));
cards.forEach((c, i) => {
  countUp(c.querySelector('.price [data-n]'), 1.0 + i * .05);
  const line = c.querySelector('.line'), len = line.getTotalLength();
  gsap.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.2, delay: 1.05 + i * .05, ease: 'power2.inOut' });
  gsap.from(c.querySelector('.area'), { opacity: 0, duration: .8, delay: 1.6 + i * .05 });
  gsap.from(c.querySelector('.end'), { scale: 0, transformOrigin: 'center', duration: .4, delay: 2.1 + i * .05, ease: 'back.out(3)' });
});

/* ---------- pill groups ---------- */
const nav = pillGroup(document.getElementById('nav'));
// demo: the pill drips from Overview over to Tickers, like the reel
gsap.delayedCall(1.8, () => nav.pick(nav.btns[4], true));

let state = { f: 'all', s: 'value', q: '' };
function apply() {
  const flip = Flip.getState(cards);
  const order = [...ROWS].sort((a, b) =>
    state.s === 'value' ? b.value - a.value : state.s === 'vol' ? b.vol - a.vol : b.chg - a.chg);
  let shown = 0;
  order.forEach(r => {
    const c = grid.querySelector(`[data-sym="${r.sym}"]`);
    grid.appendChild(c);
    const ok = (state.f === 'all' || r.dir === state.f) && r.sym.includes(state.q);
    c.classList.toggle('is-hidden', !ok); shown += ok;
  });
  document.getElementById('empty').hidden = shown > 0;
  Flip.from(flip, {
    duration: .6, ease: 'power3.inOut', stagger: .02, absolute: true, nested: true,
    onEnter: els => gsap.fromTo(els, { opacity: 0, scale: .92 }, { opacity: 1, scale: 1, duration: .45 }),
    onLeave: els => gsap.to(els, { opacity: 0, scale: .92, duration: .3 }),
  });
}
pillGroup(document.getElementById('filters'), b => { state.f = b.dataset.f; apply(); });
pillGroup(document.getElementById('sort'), b => { state.s = b.dataset.s; apply(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toUpperCase(); apply(); });
</script>
